<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEPLOLUXE • Финансовый & Налоговый Симулятор</title>
    <!-- Подключение премиального шрифта Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Премиальная светлая палитра (Warm Luxe) */
            --bg-main: #f7f5f0;          /* Мягкий молочно-бежевый фон */
            --card-bg: #ffffff;          /* Белоснежные карточки */
            --card-subtle: #f1ede6;      /* Вторичные блоки */
            --border-color: #e2dbc9;     /* Тонкие бежевые границы */
            
            --text-primary: #2c2a29;     /* Глубокий графитовый (основной текст) */
            --text-secondary: #706b65;   /* Приглушенный теплый серый */
            
            /* Благородные, не ядовитые акценты */
            --accent-brand: #d95d39;     /* Элегантный терракотово-оранжевый (Теплолюкс) */
            --accent-brand-light: #fbeee9;
            --accent-green: #3a7d5c;     /* Приглушенный шалфейно-зеленый */
            --accent-green-bg: #edf4ef;
            --accent-red: #c04e4e;       /* Приглушенный припыленно-красный */
            --accent-red-bg: #f9ecec;
            --accent-gold: #c29243;      /* Мягкий золотистый */
            --accent-gold-bg: #f8f3e9;

            --shadow-soft: 0 10px 30px rgba(44, 42, 41, 0.05);
            --shadow-modal: 0 20px 50px rgba(44, 42, 41, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .app-container {
            width: 100%;
            max-width: 980px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 720px;
            position: relative;
        }

        /* Шапка */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 36px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-brand);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: white;
        }

        .progress-pill {
            background: var(--card-subtle);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Панель метрик */
        .dashboard-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 20px 36px;
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
        }

        .metric-card {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .metric-title {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 6px;
            letter-spacing: -0.3px;
        }

        .value-green { color: var(--accent-green); }
        .value-brand { color: var(--accent-brand); }
        .value-red { color: var(--accent-red); }
        .value-gold { color: var(--accent-gold); }

        /* Экран игры / интро */
        .game-screen {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 36px;
            justify-content: space-between;
        }

        /* Интро-экран */
        .intro-container {
            animation: fadeIn 0.4s ease-out;
            max-width: 820px;
            margin: 0 auto;
        }

        .intro-badge {
            display: inline-block;
            background: var(--accent-brand-light);
            color: var(--accent-brand);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 30px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .intro-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .intro-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .info-cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .info-card {
            background: var(--card-subtle);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .info-card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .info-card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Сценарии */
        .scenario-container {
            animation: fadeIn 0.4s ease-out;
        }

        .scenario-badge {
            display: inline-block;
            background: var(--accent-brand-light);
            color: var(--accent-brand);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 30px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .scenario-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .scenario-text {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 15px;
            max-width: 860px;
        }

        /* Варианты ответов */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 28px;
        }

        .option-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-card:hover {
            border-color: var(--accent-brand);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217, 93, 57, 0.08);
        }

        .option-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 16px;
        }

        .option-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .option-hint {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .option-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .badge-green { background: var(--accent-green-bg); color: var(--accent-green); }
        .badge-red { background: var(--accent-red-bg); color: var(--accent-red); }
        .badge-gold { background: var(--accent-gold-bg); color: var(--accent-gold); }

        /* Модальное окно с обратной связью */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(44, 42, 41, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .feedback-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px;
            max-width: 600px;
            width: 100%;
            box-shadow: var(--shadow-modal);
            animation: slideUp 0.3s ease-out;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .feedback-status-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        .status-success { background: var(--accent-green-bg); color: var(--accent-green); }
        .status-warning { background: var(--accent-red-bg); color: var(--accent-red); }

        .feedback-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .feedback-text {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.65;
            margin-bottom: 24px;
        }

        .feedback-changes {
            background: var(--card-subtle);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 28px;
            font-size: 13px;
        }

        .change-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            color: var(--text-primary);
        }

        /* Кнопки */
        .btn-primary {
            width: 100%;
            background: var(--accent-brand);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            background: #be4e2b;
        }

        /* Финальный экран */
        .results-container {
            text-align: center;
            padding: 20px 0;
            max-width: 700px;
            margin: 0 auto;
        }

        .results-score {
            font-size: 54px;
            font-weight: 700;
            margin: 16px 0;
            color: var(--accent-brand);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .dashboard-bar { grid-template-columns: repeat(2, 1fr); }
            .info-cards-grid { grid-template-columns: 1fr; }
            .app-header { padding: 16px 20px; }
            .game-screen { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Шапка -->
    <div class="app-header">
        <div class="brand-logo">
            <div class="brand-icon">Т</div>
            <span>TEPLOLUXE • Налоговый Симулятор</span>
        </div>
        <div class="progress-pill" id="step-counter">Вводный курс</div>
    </div>

    <!-- Панель метрик -->
    <div class="dashboard-bar">
        <div class="metric-card">
            <div class="metric-title">Личный баланс</div>
            <div class="metric-value value-green" id="metric-balance">150 000 ₽</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Налоговые вычеты</div>
            <div class="metric-value value-brand" id="metric-deduction">0 ₽</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Риск штрафов</div>
            <div class="metric-value value-red" id="metric-risk">0%</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Фин. Грамотность</div>
            <div class="metric-value value-gold" id="metric-score">100 / 100</div>
        </div>
    </div>

    <!-- Главный экран -->
    <div class="game-screen" id="game-screen">
        <!-- Контент инжектируется через JS -->
    </div>

    <!-- Модальное окно результатов выбора -->
    <div class="modal-overlay" id="modal">
        <div class="feedback-card">
            <div class="feedback-header">
                <div class="feedback-status-icon" id="modal-icon">✓</div>
                <div class="feedback-title" id="modal-title">Правовой разбор</div>
            </div>
            <div class="feedback-text" id="modal-text"></div>
            <div class="feedback-changes" id="modal-changes"></div>
            <button class="btn-primary" id="modal-next-btn" onclick="nextQuestion()">Продолжить</button>
        </div>
    </div>
</div>

                    impact: { balance: 0, deduction: 260000, risk: 0, score: -10 },
                    feedbackTitle: "Превышение лимита",
                    feedbackText: "Закон ограничивает максимальный размер вычета на покупку квартиры суммой в 260 000 ₽. Подать заявку на большее нельзя.",
                    isSuccess: false
                }
            ]
        }
    ];

    let currentStep = -1; // -1 = Интро экран
    let state = {
        balance: 150000,
        deduction: 0,
        risk: 0,
        score: 100
    };

    function updateDashboard() {
        document.getElementById('metric-balance').innerText = state.balance.toLocaleString('ru-RU') + ' ₽';
        document.getElementById('metric-deduction').innerText = state.deduction.toLocaleString('ru-RU') + ' ₽';
        document.getElementById('metric-risk').innerText = state.risk + '%';
        document.getElementById('metric-score').innerText = state.score + ' / 100';
        
        if (currentStep === -1) {
            document.getElementById('step-counter').innerText = 'Вводный курс';
        } else if (currentStep < scenarios.length) {
            document.getElementById('step-counter').innerText = `Ситуация ${currentStep + 1} из ${scenarios.length}`;
        } else {
            document.getElementById('step-counter').innerText = 'Завершено';
        }
    }

    function renderIntro() {
        const screen = document.getElementById('game-screen');
        screen.innerHTML = `
            <div class="intro-container">
                <div class="intro-badge">Финансовая грамотность • 2026</div>
                <h1 class="intro-title">Как работать с налоговой системой и вычетами в РФ</h1>
                <p class="intro-text">
                    Каждый официально работающий гражданин России уплачивает <strong>НДФЛ (Налог на доходы физических лиц)</strong>. 
                    Налоговые вычеты — это законный инструмент, позволяющий уменьшить сумму налога или вернуть часть ранее уплаченных средств из бюджета обратно на ваш счет.
                </p>

                <div class="info-cards-grid">
                    <div class="info-card">
                        <div class="info-card-title">💡 Что такое Налоговый Вычет?</div>
                        <div class="info-card-desc">Это сумма, которая уменьшает налогооблагаемую базу. Вы можете вернуть 13% от потраченных средств на лечение, обучение, спорт, покупку квартиры или инвестиции.</div>
                    </div>
                    <div class="info-card">
                        <div class="info-card-title">⚖️ Прогрессивная шкала НДФЛ</div>
                        <div class="info-card-desc">В зависимости от уровня годового дохода ставка НДФЛ составляет от 13% до 22%. Грамотное планирование вычетов позволяет существенно сберечь личный бюджет.</div>
                    </div>
                </div>

                <p class="intro-text" style="font-size: 14px; margin-bottom: 28px;">
                    Вам предстоит пройти 5 реальных жизненных сценариев. Ваша цель — принимать финансово и юридически грамотные решения, накапливать вычеты и минимизировать риски штрафов.
                </p>

                <button class="btn-primary" onclick="startGame()">Начать симуляцию</button>
            </div>
        `;
        updateDashboard();
    }

    function startGame() {
        currentStep = 0;
        renderScenario();
    }

    function renderScenario() {
        if (currentStep >= scenarios.length) {
            renderFinalResults();
            return;
        }

        const data = scenarios[currentStep];
        const screen = document.getElementById('game-screen');

        screen.innerHTML = `
            <div class="scenario-container">
                <div class="scenario-badge">📌 ${data.badge}</div>
                <h2 class="scenario-title">${data.title}</h2>
                <p class="scenario-text">${data.text}</p>
                
                <div class="options-grid">
                    ${data.options.map((opt, idx) => `
                        <div class="option-card" onclick="selectOption(${idx})">
                            <div class="option-content">
                                <div class="option-label">${opt.label}</div>
                                <div class="option-hint">${opt.hint}</div>
                            </div>
                            <div class="option-badge ${opt.badgeStyle}">${opt.badge}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;

        updateDashboard();
    }

    function selectOption(optionIndex) {
        const scenario = scenarios[currentStep];
        const selected = scenario.options[optionIndex];

        state.balance += selected.impact.balance;
        state.deduction += selected.impact.deduction;
        state.risk = Math.min(100, Math.max(0, state.risk + selected.impact.risk));
        state.score = Math.max(0, state.score + selected.impact.score);

        const modal = document.getElementById('modal');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalChanges = document.getElementById('modal-changes');

        modalIcon.className = `feedback-status-icon ${selected.isSuccess ? 'status-success' : 'status-warning'}`;
        modalIcon.innerText = selected.isSuccess ? '✓' : '!';
        modalTitle.innerText = selected.feedbackTitle;
        modalText.innerText = selected.feedbackText;

        modalChanges.innerHTML = `
            <div class="change-item"><span>Баллы грамотности:</span> <strong>${selected.impact.score >= 0 ? '+' : ''}${selected.impact.score} б.</strong></div>
            ${selected.impact.deduction ? `<div class="change-item"><span>Налоговый вычет:</span> <strong>+${selected.impact.deduction.toLocaleString('ru-RU')} ₽</strong></div>` : ''}
            ${selected.impact.risk ? `<div class="change-item"><span>Изменение риска:</span> <strong>+${selected.impact.risk}%</strong></div>` : ''}
        `;

        modal.classList.add('active');
    }

    function nextQuestion() {
        document.getElementById('modal').classList.remove('active');
        currentStep++;
        renderScenario();
    }

    function renderFinalResults() {
        const screen = document.getElementById('game-screen');
        updateDashboard();

        let statusText = "";
        if (state.score >= 140) {
            statusText = "Вы продемонстрировали высокий уровень налоговой грамотности. Вы эффективно используете преференции законодательства РФ и защищены от рисков.";
        } else if (state.score >= 90) {
            statusText = "Хороший результат. Вы понимаете ключевые правила, но упускаете некоторые законные возможности для налоговой оптимизации.";
        } else {
            statusText = "Уровень риска превышает безопасную норму. Рекомендуется глубже изучить статьи Налогового кодекса РФ, чтобы избежать штрафных санкций.";
        }

        screen.innerHTML = `
            <div class="results-container">
                <div class="scenario-badge">Итоги симулятора</div>
                <h2 class="scenario-title">Финансовый год завершен</h2>
                
                <div class="results-score">${state.score} / 190</div>
                <p class="scenario-text" style="margin: 0 auto 28px auto;">${statusText}</p>

                <div style="display: flex; justify-content: center; gap: 16px; margin-bottom: 32px; text-align: left;">
                    <div style="background: var(--card-subtle); padding: 20px; border-radius: 16px; border:1px solid var(--border-color); flex:1;">
                        <div style="font-size:12px; color:var(--text-secondary); font-weight:600;">Итого вычетов:</div>
                        <div style="font-size:20px; font-weight:700; color:var(--accent-brand); margin-top:4px;">${state.deduction.toLocaleString('ru-RU')} ₽</div>
                    </div>
                    <div style="background: var(--card-subtle); padding: 20px; border-radius: 16px; border:1px solid var(--border-color); flex:1;">
                        <div style="font-size:12px; color:var(--text-secondary); font-weight:600;">Уровень риска:</div>
                        <div style="font-size:20px; font-weight:700; color:${state.risk > 30 ? 'var(--accent-red)' : 'var(--accent-green)'}; margin-top:4px;">${state.risk}%</div>
                    </div>
                </div>

                <button class="btn-primary" onclick="restartGame()">Пройти симуляцию заново</button>
            </div>
        `;
    }

    function restartGame() {
        currentStep = -1;
        state = { balance: 150000, deduction: 0, risk: 0, score: 100 };
        renderIntro();
    }

    // Инициализация при загрузке
    renderIntro();
</script>

</body>
</html>
